[package]
name = "epoch"
version = "0.1.0"
edition = "2024"
description = "EPOCH: Distributed Transactional NixOS Deployment Architecture"

[[bin]]
name = "epoch"
path = "src/bin/epoch.rs"

[[bin]]
name = "epoch-agent"
path = "src/bin/epoch-agent.rs"

[features]
default = []
tracy = []

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
blake3 = "1.8.7"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
hex = "0.4.3"
libc = "0.2.190"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rand = "0.9.5"
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
 tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = { version = "1.9.1", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

